name: HopcastExample
options:
  bundleIdPrefix: fr.hopcast
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Debug
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic

packages:
  HopcastKit:
    path: ..

targets:
  HopcastExample:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Hopcast Example
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Hopcast Example uses the local network to exchange content with nearby devices."
        NSBonjourServices:
          - "_hopcast._tcp"
          - "_hopcast._udp"
        NSBluetoothAlwaysUsageDescription: "Hopcast Example uses Bluetooth to discover nearby devices."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.hopcast.example
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: HopcastKit
        product: HopcastKit
